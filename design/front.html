<!-- Card front. Design units: 8px = 1mm. Size and bleed come from card.config.json via --card-w, --card-h, --bleed. -->
<div class="card" style="padding: calc(var(--bleed) + 40px) calc(var(--bleed) + 44px) calc(var(--bleed) + 38px); background: radial-gradient(ellipse 55% 70% at 50% 40%, #0A1530 0%, #060A1A 45%, #03050D 75%); display: flex; flex-direction: column; align-items: center; gap: 18px">
  <div style="flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center">
    <img src="{{ASSETS}}/SIENA-Solutions-logo-transparent.png" alt="SIENA Solutions" style="height: 180px; width: auto; display: block">
  </div>
  <div class="bg-keep" style="width: 100%; height: 1px; background: linear-gradient(90deg, rgba(51,225,255,0), #33E1FF 20%, #7AA2FF 50%, #FF4FD8 80%, rgba(255,79,216,0))"></div>
  <div class="mono" style="display: flex; flex-wrap: wrap; justify-content: center; column-gap: 13px; row-gap: 6px; font-size: 15px; letter-spacing: 0.09em; white-space: nowrap; text-transform: uppercase; color: #7F93B3">
    <span>Apps</span>
    <span>Websites</span>
    <span>AI Agents</span>
    <span>Automation</span>
    <span>Systems</span>
    <span>Marketing</span>
  </div>
</div>
